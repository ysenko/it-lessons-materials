<svg xmlns="http://www.w3.org/2000/svg" width="800" height="880" viewBox="0 0 800 880" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b7fb5"/>
      <stop offset="1" stop-color="#c9d8ee"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a36"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <clipPath id="photo">
      <rect x="20" y="410" width="760" height="320" rx="8"/>
    </clipPath>
  </defs>

  <!-- Card -->
  <rect x="0" y="0" width="800" height="880" rx="14" fill="#ffffff" stroke="#dddfe2"/>

  <!-- Header -->
  <circle cx="52" cy="50" r="28" fill="url(#avatar)"/>
  <text x="52" y="60" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">⚡</text>
  <text x="94" y="44" font-size="21" font-weight="700" fill="#050505">ЛЬВІВ_НОВИНИ_ТОП 24/7</text>
  <text x="94" y="70" font-size="16" fill="#65676b">2 год. · 🌐</text>
  <text x="760" y="50" font-size="26" fill="#65676b" text-anchor="end">···</text>

  <!-- Post text -->
  <text font-size="22" fill="#050505">
    <tspan x="24" y="125" font-weight="700">‼️ ШОК!!! Зимові канікули у Львові триватимуть</tspan>
    <tspan x="24" y="155" font-weight="700">ДО БЕРЕЗНЯ!!! 😱❄️</tspan>
    <tspan x="24" y="205">За словами джерела в міському департаменті освіти,</tspan>
    <tspan x="24" y="235">через економію електроенергії всі школи міста підуть</tspan>
    <tspan x="24" y="265">на канікули з 20 грудня аж до 1 березня. Офіційне</tspan>
    <tspan x="24" y="295">рішення оголосять «найближчими днями».</tspan>
    <tspan x="24" y="345">Батьки вже в паніці, а учні радіють! 🎉</tspan>
    <tspan x="24" y="380" font-weight="700">📢 ТЕРМІНОВО поширюйте, поки не видалили!!! 👇👇👇</tspan>
  </text>

  <!-- Attached picture -->
  <g clip-path="url(#photo)">
    <rect x="20" y="410" width="760" height="320" fill="url(#sky)"/>
    <!-- City silhouette -->
    <g fill="#3b4a63">
      <rect x="40" y="590" width="90" height="140"/>
      <rect x="130" y="560" width="70" height="170"/>
      <rect x="200" y="600" width="110" height="130"/>
      <rect x="350" y="520" width="44" height="210"/>
      <polygon points="350,520 372,470 394,520"/>
      <rect x="310" y="610" width="140" height="120"/>
      <rect x="450" y="580" width="80" height="150"/>
      <rect x="530" y="545" width="60" height="185"/>
      <polygon points="530,545 560,505 590,545"/>
      <rect x="590" y="600" width="100" height="130"/>
      <rect x="690" y="570" width="90" height="160"/>
    </g>
    <!-- Windows -->
    <g fill="#ffd66b" opacity="0.85">
      <rect x="60" y="615" width="14" height="18"/><rect x="95" y="615" width="14" height="18"/>
      <rect x="150" y="590" width="14" height="18"/><rect x="225" y="625" width="14" height="18"/>
      <rect x="265" y="625" width="14" height="18"/><rect x="335" y="635" width="14" height="18"/>
      <rect x="410" y="635" width="14" height="18"/><rect x="475" y="605" width="14" height="18"/>
      <rect x="550" y="575" width="14" height="18"/><rect x="620" y="625" width="14" height="18"/>
      <rect x="715" y="595" width="14" height="18"/><rect x="750" y="595" width="14" height="18"/>
    </g>
    <!-- Snow on the ground -->
    <path d="M20 700 Q 200 680 400 700 T 780 695 L 780 730 L 20 730 Z" fill="#ffffff"/>
    <!-- Snowflakes -->
    <g fill="#ffffff" opacity="0.9">
      <circle cx="70" cy="440" r="4"/><circle cx="160" cy="500" r="3"/><circle cx="240" cy="455" r="5"/>
      <circle cx="300" cy="530" r="3"/><circle cx="430" cy="450" r="4"/><circle cx="480" cy="520" r="3"/>
      <circle cx="610" cy="460" r="5"/><circle cx="680" cy="520" r="3"/><circle cx="740" cy="445" r="4"/>
      <circle cx="120" cy="560" r="3"/><circle cx="560" cy="480" r="3"/><circle cx="400" cy="560" r="4"/>
    </g>
    <!-- Caption over the picture -->
    <text x="400" y="505" font-size="50" font-weight="900" fill="#ffe600" stroke="#c40000" stroke-width="3" paint-order="stroke" text-anchor="middle">КАНІКУЛИ ДО БЕРЕЗНЯ!</text>
    <text x="400" y="560" font-size="30" font-weight="800" fill="#ffffff" stroke="#000000" stroke-width="2" paint-order="stroke" text-anchor="middle">❄️ школи Львова зачиняються ❄️</text>
  </g>

  <!-- Reactions and stats -->
  <text x="24" y="770" font-size="18" fill="#65676b">😱😂❤️ 2,4 тис.</text>
  <text x="776" y="770" font-size="18" fill="#65676b" text-anchor="end">847 коментарів · 1,9 тис. поширень</text>
  <line x1="20" y1="790" x2="780" y2="790" stroke="#dddfe2"/>

  <!-- Action buttons -->
  <g font-size="19" font-weight="600" fill="#65676b" text-anchor="middle">
    <text x="140" y="835">👍 Подобається</text>
    <text x="400" y="835">💬 Коментувати</text>
    <text x="660" y="835">↗️ Поділитися</text>
  </g>
</svg>
